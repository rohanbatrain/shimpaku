# docker compose -f deploy/vps/compose.yaml up -d --build   (from the repo root)
# Needs: deploy/vps/.env with SHIMPAKU_DOMAIN, and deploy/vps/snapshot/snapshot.json.
services:
  replay:
    build: { context: ../.., dockerfile: deploy/vps/Dockerfile, target: replay }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    environment:
      SHIMPAKU_TRUSTED_PROXIES: "*"   # only Caddy can reach it: no published port
    volumes:
      - ./snapshot:/snapshot:ro
    networks: [web]

  caddy:
    # caddy:2 plus the built SPA at /srv/app (Dockerfile target `edge`): one build, no shared volume
    build: { context: ../.., dockerfile: deploy/vps/Dockerfile, target: edge }
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SHIMPAKU_DOMAIN: ${SHIMPAKU_DOMAIN:?set SHIMPAKU_DOMAIN in deploy/vps/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site-built:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [replay]

networks:
  web: {}
volumes:
  caddy_data: {}
  caddy_config: {}
