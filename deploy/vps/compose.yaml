# docker compose -f deploy/vps/compose.yaml up -d --build   (from the repo root)
# Needs: deploy/vps/.env with SHIMPAKU_SITE_HOSTS, SHIMPAKU_APP_HOSTS and SHIMPAKU_LAB_UPSTREAM, and
# deploy/vps/snapshot/snapshot.json. Caddy runs on the HOST network: the host firewall's input chain
# (80/443 from Cloudflare only, ADR-0204 D2) is then the only way in — Docker-published ports would
# bypass it through FORWARD/NAT — and it reaches the lab directly over the host's NetBird interface.
services:
  replay:
    build: { context: ../.., dockerfile: deploy/vps/Dockerfile, target: replay }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cgroup_parent: edge.slice   # ADR-0204 D3: the whole edge shares one 1 GiB slice
    pids_limit: 128
    environment:
      SHIMPAKU_TRUSTED_PROXIES: "*"   # published on the host's loopback only; Caddy is the only client
      # the landing page's origins, allowed to read GET /api/public/summary cross-origin
      SHIMPAKU_PUBLIC_CORS_ORIGINS: ${SHIMPAKU_PUBLIC_CORS_ORIGINS:-}
    volumes:
      - ./snapshot:/snapshot:ro
    ports: ["127.0.0.1:8781:8780"]
    networks: [web]

  caddy:
    # caddy:2 plus the built SPA at /srv/app (Dockerfile target `edge`): one build, no shared volume
    build: { context: ../.., dockerfile: deploy/vps/Dockerfile, target: edge }
    mem_limit: 192m
    cgroup_parent: edge.slice
    restart: unless-stopped
    network_mode: host        # see the header: the host firewall governs 80/443
    environment:
      SHIMPAKU_SITE_HOSTS: ${SHIMPAKU_SITE_HOSTS:?set in deploy/vps/.env}
      SHIMPAKU_APP_HOSTS: ${SHIMPAKU_APP_HOSTS:?set in deploy/vps/.env}
      SHIMPAKU_STATUS_HOSTS: ${SHIMPAKU_STATUS_HOSTS:?set in deploy/vps/.env}
      SHIMPAKU_STATUS_SLUG: ${SHIMPAKU_STATUS_SLUG:-shimpaku}
      # host:port of shimpakud on the lab's NetBird address, e.g. 100.x.y.z:8780
      SHIMPAKU_LAB_UPSTREAM: ${SHIMPAKU_LAB_UPSTREAM:?set SHIMPAKU_LAB_UPSTREAM in deploy/vps/.env}
      SHIMPAKU_REPLAY_UPSTREAM: 127.0.0.1:8781
      SHIMPAKU_KUMA_UPSTREAM: 127.0.0.1:3001
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site-built:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [replay]

  uptime-kuma:
    # Host network: the admin UI answers on the VPS's NetBird address (the host firewall accepts the
    # tunnel interface and drops everything else on 3001), so any of the owner's NetBird devices
    # opens http://<vps netbird ip>:3001 with no SSH tunnel; the public reaches only the status page,
    # through Caddy (127.0.0.1:3001, SHIMPAKU_KUMA_UPSTREAM). Major-pinned tag; pin a digest later.
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - kuma_data:/app/data
    mem_limit: 320m
    cgroup_parent: edge.slice

networks:
  web: {}
volumes:
  caddy_data: {}
  caddy_config: {}
  kuma_data: {}
