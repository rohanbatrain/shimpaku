[project]
name = "shimpaku"
version = "0.1.0"
description = "Mist-style service-level assurance for one Junos lab: telemetry, SLEs, guardrailed actions, an MCP server and a fault-injection benchmark."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1", "pyarrow>=17", "pandas>=2.2", "numpy>=2", "scipy>=1.13", "statsmodels>=0.14",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2", "pydantic>=2.8", "pydantic-settings>=2.4",
  "mcp>=1.20", "httpx>=0.27", "argon2-cffi>=23", "itsdangerous>=2.2", "pyyaml>=6", "tomli-w>=1",
  "litellm>=1.50", "rich>=13", "typer>=0.12",
]

[project.optional-dependencies]
junos = ["junos-eznc>=2.7", "ncclient>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
shimpakud = "shimpaku.daemon:main"
shimpaku = "shimpaku.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shimpaku", "bench/virga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
