[project]
name = "shimpaku"
version = "0.0.1"
description = "A Mist-style assurance NMS for one Junos home lab, agent-first."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
junos = ["junos-eznc>=2.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shimpaku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
