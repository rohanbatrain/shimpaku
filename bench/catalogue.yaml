kind: scenario
id: WAN-03
title: WAN congestion (Junos policer on r1-r2)
layer: wan
status: selftested
executable: true
requires: [day-02-campus]
# measured 2026-10-24: 256 kbit/s gave only 10% loss (a rapid ping offers ~10 x 1400 B/s = 112 kbit/s,
# so only the burst bucket drops); 32-96 kbit/s sits well under the offered rate
toggle: {default: off, intensity: {kbps: {default: 64, range: [32, 96]}}}
health: [campus]
probes:
  - {id: big-ping, kind: ping, args: {node: sw1, target: 10.0.12.2, instance: USER, count: 50, size: 1400}, healthy: 0, faulted: {ge: 20}}
inject:
  - {junos: {node: r1, lines: [
      "set firewall policer wan-shape if-exceeding bandwidth-limit ${kbps}k burst-size-limit 1500",
      "set firewall policer wan-shape then discard",
      "set firewall family inet filter wan-out term icmp from protocol icmp",
      "set firewall family inet filter wan-out term icmp then policer wan-shape",
      "set firewall family inet filter wan-out term rest then accept",
      "set interfaces ge-0/0/0 unit 0 family inet filter output wan-out"]}}
revert:
  - {junos: {node: r1, lines: ["delete interfaces ge-0/0/0 unit 0 family inet filter output",
                               "delete firewall family inet filter wan-out", "delete firewall policer wan-shape"]}}
ground_truth:
