kind: scenario
id: FAB-11
title: Fabric link flapping (three down/up cycles on leaf1 ge-0/0/0)
layer: fabric-underlay
status: selftested
executable: true
requires: [day-06-fabric]
toggle: {default: off, intensity: {cycles: {default: 3, range: [2, 4]}}}
health: [fabric]
probes:
  - {id: lf1-flapped-ago, kind: iface_flapped_ago, args: {node: leaf1, ifname: ge-0/0/0}, faulted: {le: 240}}
  - {id: lf1-port-up, kind: iface, args: {node: leaf1, ifname: ge-0/0/0}, healthy: up/up, faulted: up/up}
inject:
  # each transition is its own `commit confirmed 2` confirmed at once on a fresh session: a chained
  # confirm must never be left pending over a down state (R9 §2.3)
  - {flap: {node: leaf1, ifname: ge-0/0/0, cycles: "${cycles}", down_s: 8, up_s: 20}}
