# Virga fault catalogue. Multi-document YAML: one `kind: lab` header, then one document per scenario
# (schema virga/scenario/v1; validated by `virga validate`, rules in virga/schema.py).
# Ported from lab-book research R9 (aiops-bench prototype) with R5 ground-truth fields added
# (fault_class / target_entity / entity_aliases, R5 §6.1 canonical IDs).
#
# status:      selftested  passed `virga selftest` live (see docs/build/bench.md for counts)
#              executable  runnable now on the Junos topology, not yet self-tested
#              designed    needs a component listed in `requires` (aiops-farm = R3 client farm VM, ...)
# executable:  true -> the runner may run it today with `--have day-06-fabric,day-02-campus`
# bench:       false -> never scheduled in a bench plan (validation checks, controls handled by the planner)
# holdout:     true -> excluded from dev plans (B4). Held-out scenarios belong in the private store
#              ($VIRGA_STORE/holdout.yaml, merged at load time), never in this repo file.
kind: lab
schema: virga/lab/v1
nodes:
  r1: {mgmt: 10.99.0.11}
  r2: {mgmt: 10.99.0.12}
  sw1: {mgmt: 10.99.0.21}
  spine1: {mgmt: 10.99.0.31}
  spine2: {mgmt: 10.99.0.32}
  leaf1: {mgmt: 10.99.0.41}
  leaf2: {mgmt: 10.99.0.42}
allocation: {write: [leaf1, spine1, r1]}   # Virga's share; B-mcp may touch spine2 ge-0/0/9 and leaf2 spare ports
vars:
  intent_dir: ~/juniper-7-day-sprint/artifacts/fabric
  host_mgmt: 10.99.0.1
decoys:                                    # B3: neutral change noise so the newest commit is usually not the fault
  # each decoy is a pair (apply, revert); `${word}` and `${n}` are drawn from the run seed
  words: [spare, reserved, patch, future, lab, tbd, cab, rack, xconn, port]
  kinds:
    - {nodes: [leaf1, spine1], apply: ["set interfaces ge-0/0/9 description ${word}-${n}"], revert: ["delete interfaces ge-0/0/9"]}
    - {nodes: [r1], apply: ["set interfaces ge-0/0/9 description ${word}-${n}"], revert: ["delete interfaces ge-0/0/9"]}
    - {nodes: [leaf1, spine1, r1], apply: ["set policy-options prefix-list pl-${word}${n} 192.0.2.${n}/32"], revert: ["delete policy-options prefix-list pl-${word}${n}"]}
timing_defaults: {preflight_timeout_s: 90, inject_timeout_s: 90, revert_timeout_s: 150, poll_s: 4,
                  fast_poll_s: 0.5, stable: 2, inject_ttl_min: 5, detect_budget_s: 300, cooldown_s: 10}
health_sets:
  fabric:
    - {id: lf1-ospf-sp1, kind: ospf, args: {node: leaf1, ifname: ge-0/0/0.0}, healthy: Full}
    - {id: lf1-ospf-sp2, kind: ospf, args: {node: leaf1, ifname: ge-0/0/1.0}, healthy: Full}
    - {id: lf1-bfd-sp1, kind: bfd, args: {node: leaf1, ifname: ge-0/0/0.0}, healthy: Up}
    - {id: lf1-ecmp, kind: nexthops, args: {node: leaf1, prefix: 10.255.0.42/32}, healthy: 2}
    - {id: lf1-bgp, kind: bgp, args: {node: leaf1, peer: 10.255.0.42}, healthy: Established}
    - {id: vxlan-ping, kind: ping, args: {node: leaf1, target: 10.100.0.42, instance: HOST}, healthy: 0}
    - {id: sp1-ospf-lf1, kind: ospf, args: {node: spine1, ifname: ge-0/0/0.0}, healthy: Full}
  campus:
    - {id: r1-ospf-r2, kind: ospf, args: {node: r1, ifname: ge-0/0/0.0}, healthy: Full}
    - {id: users-to-servers, kind: ping, args: {node: sw1, target: 10.20.0.1, instance: USER}, healthy: 0}
    - {id: r1-ssh, kind: tcp, args: {host: r1, port: 22}, healthy: open}
    - {id: r1-netconf, kind: tcp, args: {host: r1, port: 830}, healthy: open}
---
kind: scenario
id: FAB-01
title: Fabric link down (local admin disable, carrier lost)
layer: fabric-underlay
status: selftested
executable: true
requires: [day-06-fabric]
toggle: {default: off}
health: [fabric]
health_override:
  - {id: "fabric:lf1-ospf-sp1", faulted: absent}
  - {id: "fabric:lf1-bfd-sp1", faulted: absent}
  - {id: "fabric:lf1-ecmp", faulted: 1}
  - {id: "fabric:sp1-ospf-lf1", faulted: absent}
  - {id: "fabric:vxlan-ping", faulted: 0}
probes:
  - {id: lf1-port, kind: iface, args: {node: leaf1, ifname: ge-0/0/0}, healthy: up/up, faulted: {match: "^down/"}, ttd: true}
  - {id: sp1-port, kind: iface, args: {node: spine1, ifname: ge-0/0/0}}
inject: [{junos: {node: leaf1, lines: ["set interfaces ge-0/0/0 disable"]}}]
revert: [{junos: {node: leaf1, lines: ["delete interfaces ge-0/0/0 disable"]}}]
expect: {sle: [{sle: fabric-health, classifier: Redundancy}], user_impact: none}
ground_truth:
  fault_class: link-down
  target_entity: "link:leaf1:ge-0/0/0--spine1:ge-0/0/0"
  entity_aliases: ["intf:leaf1:ge-0/0/0", "intf:spine1:ge-0/0/0"]
  root_cause: {entity: "leaf1:ge-0/0/0", kind: admin-disabled, via: commit}
  classifiers: [Redundancy, Adjacency]
  blast_radius: {entities: ["leaf1:ge-0/0/0", "spine1:ge-0/0/0"], devices: [leaf1, spine1], vlans: [], clients: [],
                 note: "ECMP leaf1->leaf2 2->1; overlay and VLAN 100 unaffected"}
remediation: {accept: [null, {tool: rollback_config, args: {node: leaf1, rollback_id: 1}}], guardrail: G1-infra-ports-need-approval}
risk: low
cleanup: revert is idempotent; config equality vs snapshot proves it
