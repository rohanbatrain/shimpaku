kind: scenario
id: FAB-04
title: OSPF MTU mismatch on a fabric link (adjacency stuck)
layer: fabric-underlay
status: selftested
executable: true
requires: [day-06-fabric]
toggle: {default: off, intensity: {mtu: {default: 1400, range: [1280, 1480]}}}
health: [fabric]
health_override:
  - {id: "fabric:lf1-ospf-sp1", faulted: {ne: Full}}
  - {id: "fabric:lf1-bfd-sp1", faulted: Up}   # measured: BFD stays Up while OSPF is stuck in ExStart
  - {id: "fabric:lf1-ecmp", faulted: 1}
  - {id: "fabric:sp1-ospf-lf1", faulted: {ne: Full}}
  - {id: "fabric:vxlan-ping", faulted: 0}
probes:
  - {id: lf1-port-up, kind: iface, args: {node: leaf1, ifname: ge-0/0/0}, faulted: up/up}
inject:
  - {junos: {node: leaf1, lines: ["set interfaces ge-0/0/0 unit 0 family inet mtu ${mtu}"]}}
  - {junos_op: {node: leaf1, cmd: "clear ospf neighbor 10.0.11.1"}}
revert: [{junos: {node: leaf1, lines: ["delete interfaces ge-0/0/0 unit 0 family inet mtu"]}}]
timing: {stable: 3, poll_s: 6}
expect: {sle: [{sle: fabric-health, classifier: Adjacency}], decision_tree: "MTU mismatch (link up, adjacency not Full)"}
ground_truth:
  fault_class: mtu-mismatch
  target_entity: "link:leaf1:ge-0/0/0--spine1:ge-0/0/0"
  entity_aliases: ["intf:leaf1:ge-0/0/0", "intf:spine1:ge-0/0/0"]
  root_cause: {entity: "leaf1:ge-0/0/0", kind: mtu-mismatch}
  classifiers: [Adjacency]
  blast_radius: {entities: ["leaf1:ge-0/0/0", "spine1:ge-0/0/0"], devices: [leaf1, spine1], vlans: [], clients: []}
remediation: {accept: [{tool: rollback_config, args: {node: leaf1, rollback_id: 1}}], guardrail: G1-infra-ports-need-approval}
risk: low
