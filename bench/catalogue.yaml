title: Overlay BGP EVPN session down (VLAN 100 cut, underlay healthy)
layer: fabric-overlay
status: selftested
executable: true
requires: [day-06-fabric]
toggle: {default: off}
health: [fabric]
health_override:
  - {id: "fabric:lf1-bgp", faulted: {ne: Established}}
  - {id: "fabric:vxlan-ping", faulted: 100}
  - {id: "fabric:lf1-ecmp", faulted: 2}
probes:
  - {id: lf2-bgp-view, kind: bgp, args: {node: leaf2, peer: 10.255.0.41}}
inject: [{junos: {node: leaf1, lines: ["deactivate protocols bgp group overlay neighbor 10.255.0.42"]}}]
revert: [{junos: {node: leaf1, lines: ["activate protocols bgp group overlay neighbor 10.255.0.42"]}}]
timing: {revert_timeout_s: 240}
expect: {sle: [{sle: successful-connects, classifier: Unreachable}, {sle: application, classifier: Unreachable}]}
