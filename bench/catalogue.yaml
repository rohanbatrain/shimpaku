kind: scenario
id: FAB-03
title: BFD removed from a fabric link (latent, no user impact)
layer: fabric-underlay
status: selftested
executable: true
requires: [day-06-fabric]
toggle: {default: off}
health: [fabric]
health_override: [{id: "fabric:lf1-bfd-sp1", faulted: absent}]
probes:
  - {id: lf1-intent, kind: intent_missing, args: {node: leaf1, intent: "${intent_dir}/leaf1.set"}, healthy: 0, faulted: 2}
  - {id: lf1-ospf-still-full, kind: ospf, args: {node: leaf1, ifname: ge-0/0/0.0}, faulted: Full}
inject:
  - {junos: {node: leaf1, lines: ["delete protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection"]}}
  - {junos: {node: spine1, lines: ["delete protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection"]}}
revert:
  - {junos: {node: leaf1, lines: ["set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection minimum-interval 300",
                                  "set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection multiplier 3"]}}
  - {junos: {node: spine1, lines: ["set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection minimum-interval 300",
                                   "set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 bfd-liveness-detection multiplier 3"]}}
expect: {sle: [], compliance: "intent drift: BFD missing", user_impact: "none until a silent failure (then 40 s black hole, FAB-08)"}
ground_truth:
  fault_class: bfd-removed
  target_entity: "link:leaf1:ge-0/0/0--spine1:ge-0/0/0"
  entity_aliases: ["intf:leaf1:ge-0/0/0", "intf:spine1:ge-0/0/0"]
  root_cause: {entity: "leaf1:ge-0/0/0.0", kind: config-drift-bfd-missing}
  classifiers: [Compliance]
  blast_radius: {entities: ["leaf1:ge-0/0/0", "spine1:ge-0/0/0"], devices: [leaf1, spine1], vlans: [], clients: []}
remediation: {accept: [{tool: rollback_config, args: {node: leaf1, rollback_id: 1}}], guardrail: G8-restore-intent-from-source}
risk: low
