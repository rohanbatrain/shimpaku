kind: scenario
id: CAM-02
title: L2 loop / broadcast storm on sw1 access ports
layer: campus-l2
status: designed
executable: false
requires: [day-02-campus, aiops-farm, farm-two-access-nics]
inject: [{sh: {on: aiops-farm, cmd: "ip link add aiops-loop type bridge stp_state 0; ip link set eth1 master aiops-loop; ip link set eth2 master aiops-loop; tc qdisc add dev aiops-loop root tbf rate ${pps_cap}kbit burst 32k latency 50ms; ip link set aiops-loop up"}}]
revert: [{sh: {on: aiops-farm, cmd: "ip link del aiops-loop"}}]
verify: "sw1 `show interfaces ge-0/0/3 extensive` broadcast pps delta > 500/s; mac-move log shows the farm MAC flapping; revert: delta back < 10/s"
ground_truth:
  fault_class: l2-loop
  target_entity: "intf:sw1:ge-0/0/3"
  entity_aliases: ["intf:sw1:ge-0/0/4"]
  root_cause: {entity: "sw1:ge-0/0/3", kind: l2-loop, pair: "sw1:ge-0/0/4"}
  classifiers: [Loop, Throughput]
  blast_radius: {entities: ["vlan:10", "sw1"], devices: [sw1, r1], vlans: [10], clients: ["all VLAN 10"]}
remediation: {accept: [{tool: disable_port, args: {node: sw1, ifname: ge-0/0/3}}], guardrail: G1-access-port-only}
risk: high (host CPU; rate-capped by tbf; 60 s max hold)
