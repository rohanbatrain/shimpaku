kind: scenario
id: CAM-05
title: Shadowing filter term drops users -> servers (no counter)
layer: campus-l3
status: selftested
executable: true
requires: [day-02-campus]
toggle: {default: off}
timing: {stable: 1}
health: [campus]
health_override: [{id: "campus:users-to-servers", faulted: 100}]
probes:
  # measured 2026-10-24 (--repeat 5): an exact `healthy: 3` match on 3 pings flaked under host load
  # (load ~19-20) -- occasional ICMP loss on an otherwise-healthy path left the delta at 0-2 and the
  # poll never held `stable` within revert_timeout_s, 4/5 repeats. {ge: 1} still proves the filter is
  # not blocking (the faulted case is unambiguous: delta == 0, no packet gets through at all).
  - {id: icmp-counter, kind: ping_counter_delta, args: {node: sw1, target: 10.20.0.1, instance: USER, counter_node: r1,
     filter: F-USERS-IN, counter: users-icmp, count: 5}, healthy: {ge: 1}, faulted: 0}
inject:
  - {junos: {node: r1, lines: ["set firewall family inet filter F-USERS-IN term quarantine from source-address 10.10.0.0/24",
                               "set firewall family inet filter F-USERS-IN term quarantine then discard",
                               "insert firewall family inet filter F-USERS-IN term quarantine before term dns"]}}
revert: [{junos: {node: r1, lines: ["delete firewall family inet filter F-USERS-IN term quarantine"]}}]
expect: {sle: [{sle: application, classifier: Unreachable}], hint: "every counter in the filter reads zero"}
ground_truth:
  fault_class: acl-shadow-term
  target_entity: "node:r1"
  entity_aliases: ["intf:r1:ge-0/0/1"]
  root_cause: {entity: "r1:F-USERS-IN:quarantine", kind: filter-shadow-term}
  classifiers: [Unreachable]
  blast_radius: {entities: ["vlan:10", "r1:ge-0/0/1.10"], devices: [r1], vlans: [10], clients: ["all VLAN 10 users"]}
remediation: {accept: [{tool: rollback_config, args: {node: r1, rollback_id: 1}}], guardrail: G4-commit-confirmed-and-approval}
risk: low
