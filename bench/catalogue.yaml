  fault_class: link-down
  target_entity: "link:leaf1:ge-0/0/0--spine1:ge-0/0/0"
  entity_aliases: ["intf:leaf1:ge-0/0/0", "intf:spine1:ge-0/0/0"]
  root_cause: {entity: "spine1:ge-0/0/0", kind: far-end-down-undetected, contributing: "leaf1:ge-0/0/0.0 bfd-missing"}
  classifiers: [Adjacency, Loss]
  blast_radius: {entities: ["spine1", "leaf1:ge-0/0/0"], devices: [leaf1, spine1, leaf2], vlans: [100], clients: ["flows hashed via spine1 for ~40 s"]}
risk: medium
