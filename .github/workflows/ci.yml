# Offline checks only: no lab, no device, no LLM. Live-lab tests are marked `-m lab` and skipped.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -e ".[dev,junos]"
      - run: .venv/bin/pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  image:
    # The public replay image: builds, serves the fixture snapshot read-only, refuses writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/vps/Dockerfile -t shimpaku-replay .
      - run: |
          docker run -d --name r -p 8780:8780 --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/tests/fixtures:/snapshot:ro" -e SHIMPAKU_REPLAY=/snapshot/live_snapshot.json shimpaku-replay
          for i in $(seq 30); do curl -fs 127.0.0.1:8780/api/whoami && break; sleep 1; done
          curl -fs 127.0.0.1:8780/api/whoami | python3 -c 'import json,sys; w=json.load(sys.stdin); assert w["replay"] and not w["can_approve"], w'
          curl -fs 127.0.0.1:8780/api/actions >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8780/api/actions/x/approve)" = 403
          curl -fs 127.0.0.1:8780/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs r
