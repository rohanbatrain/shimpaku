# Offline checks only: no lab, no device, no LLM. Live-lab tests are marked `-m lab` and skipped.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv && uv pip install -p .venv -e ".[dev,junos]"
      - run: .venv/bin/pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
  image:
    # The public replay image: builds, serves the fixture snapshot read-only, refuses writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/vps/Dockerfile --target replay -t shimpaku-replay .
      - run: |
          docker run -d --name replay-smoke -p 8780:8780 --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/tests/fixtures:/snapshot:ro" -e SHIMPAKU_REPLAY=/snapshot/live_snapshot.json shimpaku-replay
          for i in $(seq 30); do curl -fs 127.0.0.1:8780/api/whoami && break; sleep 1; done
          curl -fs 127.0.0.1:8780/api/whoami | python3 -c 'import json,sys; w=json.load(sys.stdin); assert w["replay"] and not w["can_approve"], w'
          curl -fs 127.0.0.1:8780/api/actions >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8780/api/actions/x/approve)" = 403
          curl -fs 127.0.0.1:8780/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs replay-smoke
  edge:
    # The edge image (Caddy + rate_limit + cloudflare ip source): the Caddyfile validates, and with
    # the lab unreachable reads fail over to the replay while writes and /mcp answer 503.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/vps/Dockerfile --target edge -t shimpaku-edge .
      - run: docker build -f deploy/vps/Dockerfile --target replay -t shimpaku-replay .
      - run: |
          docker run --rm -e SHIMPAKU_SITE_HOSTS=localhost -e SHIMPAKU_APP_HOSTS=app.localhost -e SHIMPAKU_LAB_UPSTREAM=192.0.2.1:8780 \
            shimpaku-edge caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          docker run --rm shimpaku-edge caddy list-modules | grep -E '^(http.handlers.rate_limit|http.ip_sources.cloudflare)$'
      - run: |
          docker network create web
          docker run -d --name replay --network web --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/tests/fixtures:/snapshot:ro" -e SHIMPAKU_REPLAY=/snapshot/live_snapshot.json \
            -e SHIMPAKU_TRUSTED_PROXIES='*' shimpaku-replay
          mkdir -p site && echo '<h1>landing</h1>' > site/index.html
          # 192.0.2.1 (TEST-NET-1) never answers: the lab is "down".
          docker run -d --name edge --network web -p 443:443 -e SHIMPAKU_SITE_HOSTS=localhost -e SHIMPAKU_APP_HOSTS=app.localhost \
            -e SHIMPAKU_LAB_UPSTREAM=192.0.2.1:8780 -v "$PWD/site:/srv/site:ro" shimpaku-edge
          c() { curl -sk --resolve app.localhost:443:127.0.0.1 --resolve localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' "$@"; }
          for i in $(seq 40); do [ "$(c https://app.localhost/api/whoami)" = 200 ] && break; sleep 1; done
          test "$(c https://localhost/)" = 200
          test "$(c https://app.localhost/start)" = 200
          curl -sk --resolve app.localhost:443:127.0.0.1 https://app.localhost/api/whoami \
            | python3 -c 'import json,sys; w=json.load(sys.stdin); assert w["replay"] and not w["can_approve"], w'
          test "$(c -X POST https://app.localhost/api/actions/x/approve)" = 503
          curl -sk --resolve app.localhost:443:127.0.0.1 -X POST https://app.localhost/api/actions/x/approve | grep -q 'recorded replay'
          test "$(c -X POST https://app.localhost/mcp)" = 503
      - if: failure()
        run: docker logs edge; docker logs replay
